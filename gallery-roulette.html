<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Roulette</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#14161b;
  --panel:#1d2027;
  --panel-2:#262a33;
  --accent:#d8a73d;
  --accent-dim:#8c6c22;
  --accent-2:#4c8c82;
  --text:#edeae0;
  --text-dim:#9aa0ac;
  --border:#333843;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:40px 16px;
}

.console{
  width:100%;
  max-width:600px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}

.marquee{
  position:relative;
  padding:28px 24px 20px;
  text-align:center;
  border-bottom:1px solid var(--border);
  background:
    radial-gradient(circle at 4px 4px, var(--accent-dim) 1.6px, transparent 1.8px) repeat-x,
    var(--panel-2);
  background-size:24px 100%, auto;
  background-position: 12px 8px, 0 0;
}
.marquee::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:6px;
  background:
    radial-gradient(circle at 4px 4px, var(--accent-dim) 1.6px, transparent 1.8px) repeat-x;
  background-size:24px 100%;
  background-position:12px 0;
}
.marquee.lit::before,
.marquee.lit::after{
  background-image:radial-gradient(circle at 4px 4px, var(--accent) 1.6px, transparent 1.8px);
}

h1{
  font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
  font-size:2.4rem;
  letter-spacing:0.12em;
  margin:6px 0 4px;
  color:var(--accent);
}
.tagline{
  color:var(--text-dim);
  font-size:0.85rem;
  margin:0;
}

.section{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
}
.section:last-of-type{
  border-bottom:none;
}
.section h2{
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:0.08em;
  color:var(--text-dim);
  margin:0 0 12px;
}

/* segmented type filter */
.segmented{
  display:flex;
  border:1px solid var(--border);
  border-radius:5px;
  overflow:hidden;
}
.segmented button{
  flex:1;
  padding:10px 8px;
  background:var(--panel-2);
  border:none;
  color:var(--text-dim);
  font-family:'Inter',sans-serif;
  font-size:0.9rem;
  font-weight:500;
  cursor:pointer;
  border-right:1px solid var(--border);
  transition:background 0.15s, color 0.15s;
}
.segmented button:last-child{border-right:none;}
.segmented button:hover{color:var(--text);}
.segmented button.active{
  background:var(--accent);
  color:#1a1300;
  font-weight:600;
}

/* folders */
.folder-actions{
  display:flex;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.btn-outline{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 14px;
  border-radius:5px;
  font-size:0.85rem;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:border-color 0.15s, color 0.15s;
}
.btn-outline:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.folder-list{
  max-height:190px;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--panel-2);
}
.folder-list.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:80px;
  color:var(--text-dim);
  font-size:0.85rem;
  text-align:center;
  padding:12px;
}
.folder-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  font-size:0.85rem;
}
.folder-row:last-child{border-bottom:none;}
.folder-row input[type="checkbox"]{
  accent-color:var(--accent);
  width:16px;
  height:16px;
  flex-shrink:0;
}
.folder-row .path{
  flex:1;
  color:var(--text);
  word-break:break-all;
}
.folder-row .count{
  color:var(--text-dim);
  font-size:0.75rem;
  white-space:nowrap;
}

.lib-summary{
  margin-top:10px;
  font-size:0.8rem;
  color:var(--text-dim);
}
.lib-summary strong{color:var(--accent);}

/* spin area */
.spin-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 24px;
  gap:18px;
}

.wheel{
  width:110px;
  height:110px;
  border-radius:50%;
  background:conic-gradient(
    var(--accent) 0deg 45deg,
    var(--accent-2) 45deg 90deg,
    var(--accent) 90deg 135deg,
    var(--accent-2) 135deg 180deg,
    var(--accent) 180deg 225deg,
    var(--accent-2) 225deg 270deg,
    var(--accent) 270deg 315deg,
    var(--accent-2) 315deg 360deg
  );
  border:4px solid var(--panel-2);
  box-shadow:0 0 0 1px var(--border);
  position:relative;
  transition:transform 1.4s cubic-bezier(.17,.89,.32,1.1);
}
.wheel::before{
  content:"";
  position:absolute;
  top:-14px;
  left:50%;
  transform:translateX(-50%);
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:12px solid var(--accent);
}
.wheel::after{
  content:"";
  position:absolute;
  top:50%; left:50%;
  width:22px; height:22px;
  background:var(--panel);
  border:2px solid var(--panel-2);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.spin-btn{
  background:var(--accent);
  color:#1a1300;
  border:none;
  padding:14px 40px;
  border-radius:999px;
  font-family:'Bebas Neue','Arial Narrow',sans-serif;
  font-size:1.3rem;
  letter-spacing:0.1em;
  cursor:pointer;
  transition:transform 0.1s, background 0.15s, opacity 0.15s;
}
.spin-btn:hover:not(:disabled){background:#e8ba52;}
.spin-btn:active:not(:disabled){transform:scale(0.97);}
.spin-btn:disabled{opacity:0.55;cursor:not-allowed;}

.spin-status{
  min-height:20px;
  font-size:0.85rem;
  color:var(--text-dim);
  text-align:center;
}
.spin-status.flicker{color:var(--accent);}

/* result */
.result{
  padding:0 24px 28px;
}
.result-empty{
  color:var(--text-dim);
  font-size:0.85rem;
  text-align:center;
  padding:20px 0 4px;
}
.result-media{
  width:100%;
  border-radius:6px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--border);
}
.result-media img,
.result-media video{
  display:block;
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:#000;
}
.result-meta{
  margin-top:10px;
  font-size:0.8rem;
  color:var(--text-dim);
  word-break:break-all;
}
.result-meta .name{
  color:var(--text);
  font-weight:600;
  display:block;
  margin-bottom:2px;
}

input[type="file"]{display:none;}

button:focus-visible,
input[type="checkbox"]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

@media (max-width:480px){
  h1{font-size:1.9rem;}
  .spin-btn{padding:12px 30px;font-size:1.1rem;}
}
</style>
</head>
<body>

<div class="console">

  <div class="marquee" id="marquee">
    <h1>Gallery Roulette</h1>
    <p class="tagline">Pick your filters, spin, and land on a random photo or video from your own computer.</p>
  </div>

  <div class="section">
    <h2>What to show</h2>
    <div class="segmented" id="typeFilter">
      <button data-type="photo">Photos</button>
      <button data-type="video">Videos</button>
      <button data-type="both" class="active">Both</button>
    </div>
  </div>

  <div class="section">
    <h2>Folders</h2>
    <div class="folder-actions">
      <button class="btn-outline" id="addFolderBtn">Add folder…</button>
      <button class="btn-outline" id="resetBtn" style="display:none;">Clear all folders</button>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <div class="folder-list empty" id="folderList">No folders added yet. Add one to build your library.</div>
    <div class="lib-summary" id="libSummary"></div>
  </div>

  <div class="spin-section">
    <div class="wheel" id="wheel"></div>
    <button class="spin-btn" id="spinBtn" disabled>Spin</button>
    <div class="spin-status" id="spinStatus">Add a folder to get started</div>
  </div>

  <div class="result" id="resultArea">
    <div class="result-empty">Your random pick will appear here.</div>
  </div>

</div>

<script>
const PHOTO_EXT = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','heic','heif','tif','tiff','avif']);
const VIDEO_EXT = new Set(['mp4','mov','webm','avi','mkv','m4v','wmv','flv','mpeg','mpg','ogv']);

// dirPath -> { included: bool }
const folders = new Map();
// flat entries: { file, dir, ext, type }
let entries = [];
let typeFilter = 'both';
let currentObjectUrl = null;
let spinTimer = null;

// remember the last volume the person set, for the length of this session
// (falls back to an in-memory default if storage isn't available)
let savedVolume = 0.5;
try {
  const stored = localStorage.getItem('galleryRouletteVolume');
  if (stored !== null) savedVolume = parseFloat(stored);
} catch (e) { /* storage unavailable, use in-memory default */ }

function rememberVolume(vol) {
  savedVolume = vol;
  try {
    localStorage.setItem('galleryRouletteVolume', String(vol));
  } catch (e) { /* storage unavailable, in-memory value still updated */ }
}

const folderInput = document.getElementById('folderInput');
const addFolderBtn = document.getElementById('addFolderBtn');
const resetBtn = document.getElementById('resetBtn');
const folderListEl = document.getElementById('folderList');
const libSummaryEl = document.getElementById('libSummary');
const spinBtn = document.getElementById('spinBtn');
const spinStatus = document.getElementById('spinStatus');
const resultArea = document.getElementById('resultArea');
const wheel = document.getElementById('wheel');
const marquee = document.getElementById('marquee');
const typeFilterEl = document.getElementById('typeFilter');

addFolderBtn.addEventListener('click', () => folderInput.click());

folderInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  for (const file of files) {
    const rel = file.webkitRelativePath || file.name;
    const parts = rel.split('/');
    parts.pop(); // drop filename
    const dir = parts.join('/') || '(root)';
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    let type = null;
    if (PHOTO_EXT.has(ext)) type = 'photo';
    else if (VIDEO_EXT.has(ext)) type = 'video';
    else continue; // skip non-media files

    if (!folders.has(dir)) folders.set(dir, { included: true });
    entries.push({ file, dir, ext, type });
  }
  folderInput.value = '';
  renderFolders();
  updateSpinAvailability();
});

resetBtn.addEventListener('click', () => {
  folders.clear();
  entries = [];
  renderFolders();
  updateSpinAvailability();
  clearResult();
});

typeFilterEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  typeFilter = btn.dataset.type;
  [...typeFilterEl.children].forEach(b => b.classList.toggle('active', b === btn));
  renderFolders();
  updateSpinAvailability();
});

function matchesTypeFilter(entry) {
  return typeFilter === 'both' || entry.type === typeFilter;
}

function renderFolders() {
  const dirs = [...folders.keys()].sort();
  if (dirs.length === 0) {
    folderListEl.className = 'folder-list empty';
    folderListEl.textContent = 'No folders added yet. Add one to build your library.';
    resetBtn.style.display = 'none';
    libSummaryEl.textContent = '';
    return;
  }

  resetBtn.style.display = '';
  folderListEl.className = 'folder-list';
  folderListEl.innerHTML = '';

  dirs.forEach(dir => {
    const depth = dir.split('/').length - 1;
    const countForType = entries.filter(en => en.dir === dir && matchesTypeFilter(en)).length;

    const row = document.createElement('div');
    row.className = 'folder-row';
    row.style.paddingLeft = (12 + depth * 16) + 'px';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = folders.get(dir).included;
    checkbox.addEventListener('change', () => {
      folders.get(dir).included = checkbox.checked;
      updateSummary();
      updateSpinAvailability();
    });

    const path = document.createElement('span');
    path.className = 'path';
    path.textContent = dir;

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = countForType + (countForType === 1 ? ' file' : ' files');

    row.appendChild(checkbox);
    row.appendChild(path);
    row.appendChild(count);
    folderListEl.appendChild(row);
  });

  updateSummary();
}

function getCandidates() {
  return entries.filter(en => {
    const f = folders.get(en.dir);
    return f && f.included && matchesTypeFilter(en);
  });
}

function updateSummary() {
  const total = getCandidates().length;
  libSummaryEl.innerHTML = total > 0
    ? `<strong>${total}</strong> file${total === 1 ? '' : 's'} match your current filters.`
    : `No files match your current filters — check a folder or change the type.`;
}

function updateSpinAvailability() {
  const total = getCandidates().length;
  spinBtn.disabled = total === 0;
  if (total === 0 && entries.length === 0) {
    spinStatus.textContent = 'Add a folder to get started';
  } else if (total === 0) {
    spinStatus.textContent = 'Nothing matches — include a folder or change the filter';
  } else {
    spinStatus.textContent = `Ready — ${total} file${total === 1 ? '' : 's'} in the wheel`;
  }
}

function clearResult() {
  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = null;
  }
  resultArea.innerHTML = '<div class="result-empty">Your random pick will appear here.</div>';
}

spinBtn.addEventListener('click', () => {
  const candidates = getCandidates();
  if (candidates.length === 0) return;

  spinBtn.disabled = true;
  spinStatus.classList.add('flicker');
  marquee.classList.add('lit');

  // spin the wheel visual
  const currentRotation = wheelRotation();
  const nextRotation = currentRotation + 1080 + Math.floor(Math.random() * 360);
  wheel.style.transform = `rotate(${nextRotation}deg)`;
  wheel.dataset.rotation = nextRotation;

  // flicker through filenames like a slot machine
  let ticks = 0;
  const maxTicks = 16;
  spinTimer = setInterval(() => {
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    spinStatus.textContent = pick.file.name;
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(spinTimer);
      finishSpin(candidates);
    }
  }, 80);
});

function wheelRotation() {
  return parseFloat(wheel.dataset.rotation || '0');
}

function finishSpin(candidates) {
  const winner = candidates[Math.floor(Math.random() * candidates.length)];
  showResult(winner);
  spinStatus.classList.remove('flicker');
  marquee.classList.remove('lit');
  spinStatus.textContent = `Landed on: ${winner.file.name}`;
  spinBtn.disabled = false;
}

function showResult(entry) {
  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
  }
  currentObjectUrl = URL.createObjectURL(entry.file);

  resultArea.innerHTML = '';
  const mediaWrap = document.createElement('div');
  mediaWrap.className = 'result-media';

  if (entry.type === 'photo') {
    const img = document.createElement('img');
    img.src = currentObjectUrl;
    img.alt = entry.file.name;
    mediaWrap.appendChild(img);
  } else {
    const video = document.createElement('video');
    video.src = currentObjectUrl;
    video.controls = true;
    video.autoplay = true;
    video.muted = false;
    video.volume = savedVolume;
    video.loop = true;
    video.addEventListener('volumechange', () => rememberVolume(video.volume));
    mediaWrap.appendChild(video);
  }

  const meta = document.createElement('div');
  meta.className = 'result-meta';
  meta.innerHTML = `<span class="name">${entry.file.name}</span>${entry.dir}`;

  resultArea.appendChild(mediaWrap);
  resultArea.appendChild(meta);
}
</script>

</body>
</html>
